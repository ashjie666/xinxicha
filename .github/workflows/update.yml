# 定时采集中国游戏厂商海外信息差信号，并把 web/ 目录发布到 GitHub Pages 与阿里云。
#
# cron 用 UTC：'7 1 * * *' 即每天 UTC 01:07（北京时间 09:07），错开整点避开高峰。
# 信息差信号是日级粒度，每天 1 次已足够；TTL 约束：config.json 的 collect.cache_ttl_hours
# （现 12）只需 ≤ cron 间隔（24h）即可，无需同步调整。
#
# 与 wordseeker 的差异：
#   - 采集器主体只用标准库；Google Trends（P1 主源）走可选依赖 pytrends，故 collect job 会先装它
#   - 数据源免凭据（Steam 官方接口 + Bing News RSS），无 SerpApi/代理需求
#   - 网络采集有硬预算（config.json collect.budget_seconds=60），单次运行约 1-3 分钟
#   - P1 源不可达时自动走 P2（Bing News RSS）/P3（历史值降权）回退链，站点不会空转
#
# 部署拆成两个互不影响的 job，二者都 needs: collect，任一失败不阻塞另一个：
#   - deploy  → GitHub Pages
#   - aliyun  → rsync 同步到阿里云 /www/wwwroot/sites/xinxicha/
# aliyun 需要仓库配好 SSH_HOST / SSH_USER / SSH_KEY 三个 Secrets，且服务器已装 rsync。

name: update-and-deploy

on:
  schedule:
    - cron: '7 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - 'config.json'
      - '.github/workflows/update.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore collector cache
        uses: actions/cache@v4
        with:
          path: data
          key: xinxicha-data-${{ github.run_id }}
          restore-keys: |
            xinxicha-data-

      # pytrends 是 Google Trends 主源（P1）的唯一依赖；装上后 runner 才会真正请求 Trends。
      # 其余采集逻辑仍只用标准库。
      - name: Install pytrends (Google Trends P1)
        run: python -m pip install --quiet pytrends

      - name: Collect
        run: python -m collector.update

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --quiet --cached; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): refresh xinxicha signals"
            git push
          fi

      - name: Package site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      # 同一份采集产物也交给 aliyun 部署，避免它 checkout 到旧提交
      - name: Upload site for aliyun
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: web

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 与上面 deploy 并列、互不影响：它失败不会让 Pages 不发布，反之亦然。
  aliyun:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      # 取 collect 刚产出的同一份静态站（不要 checkout：那会拿到触发提交里的旧数据）
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: 推送静态站到阿里云
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            site/ "$SSH_USER@$SSH_HOST:/www/wwwroot/sites/xinxicha/"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "chown -R www:www /www/wwwroot/sites/xinxicha && find /www/wwwroot/sites/xinxicha -type d -exec chmod 755 {} \; && find /www/wwwroot/sites/xinxicha -type f -exec chmod 644 {} \;"
